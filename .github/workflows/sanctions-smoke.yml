name: Sanctions download smoke

# 2026-11-23 审计 P0-A：官方名单站点会 302 到 CDN，mock 测试测不到。
# S10（2026-11-24）：覆盖全部六份名单（OFAC SDN / OFAC 非 SDN / CSL / UN /
# EU / UK）；每晚真实下载前 1 MB，校验 HTTP 200、非空响应与最终主机白名单。
# 任何一份失败脚本退出码非 0，workflow 标红。

on:
  push:
    branches: [main]
    paths:
      - "trade/osint/sanctions/**"
      - "scripts/sanctions_smoke.py"
      - ".github/workflows/sanctions-smoke.yml"
  schedule:
    # 每天 18:30 UTC = 次日 03:30 CST，排在 Hermes 冒烟之后
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # 只用到标准库 + 仓库内代码，不装任何第三方依赖
      - name: Download all sanctions lists and verify redirect hosts
        run: python scripts/sanctions_smoke.py
