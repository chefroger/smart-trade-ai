name: Release Build (Mac)

# 只保留手动触发（2026-11-20 决定）：Mac 包还没验证，且包里内嵌的 Hermes
# 是构建时的版本、失败不阻断（审计 P1-9）。确认可分发后再恢复 tag 触发。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── macOS (pywebview → .app.zip) ──
          - os: macos-latest
            setup-cmd: |
              pip install -e ".[desktop]"
              pip install pyinstaller>=6.0
            spec-path: tradewin-mac.spec
            artifact-glob: dist/TradeWin-*.zip
            asset-suffix: "-macOS.zip"
            post-build: |
              cd dist
              zip -r "TradeWin-${VER}-macOS.zip" "TradeWin.app"
              rm -rf "TradeWin.app"


    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # 与部署一致：Hermes ≥0.21.6 只提供 3.14 的依赖集，用 3.12 装会失败
          python-version: "3.14"

      - run: python -m pip install --upgrade pip

      # 安装依赖
      - name: Install dependencies
        shell: bash
        run: ${{ matrix.setup-cmd }}

      # Hermes 是打包版运行时的一部分：装不上就说明这个 .app 里没有 AI，
      # 必须让构建失败，而不是产出一个坏包（2026-11-23 审计 P2）。
      - name: Install Hermes Agent (required)
        run: pip install hermes-agent

      - name: Verify Hermes import
        shell: bash
        run: |
          python -c "import run_agent, hermes_cli; print('Hermes:', getattr(hermes_cli, '__version__', 'unknown'))"

      - name: Record Hermes version
        id: hermes
        shell: bash
        run: |
          HERMES_VER="$(python -c "import hermes_cli; print(getattr(hermes_cli, '__version__', 'unknown'))")"
          echo "ver=$HERMES_VER" >> "$GITHUB_OUTPUT"
          echo "Hermes agent version: $HERMES_VER" >> "$GITHUB_STEP_SUMMARY"

      # 清理旧构建
      - name: Clean old builds
        shell: bash
        run: rm -rf build dist

      # PyInstaller
      - name: Build with PyInstaller
        run: pyinstaller --clean --noconfirm ${{ matrix.spec-path }}

      # 提取版本号
      - name: Get version
        id: version
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          # tag 触发时 ref_name 是 v0.8.0 这类；手动触发时是分支名（如 main），
          # 此时改用 pyproject 的版本号，避免打出 TradeWin-main 这种名字
          if [[ "$TAG" == v* ]]; then
            VER="${TAG#v}"
          else
            VER="$(grep -m1 '^version' pyproject.toml | sed 's/.*"\(.*\)".*/\1/')"
          fi
          echo "ver=$VER" >> "$GITHUB_OUTPUT"

      # 后处理（macOS 打包 .zip）
      - name: Post-build
        if: matrix.post-build != ''
        shell: bash
        env:
          VER: ${{ steps.version.outputs.ver }}
        run: ${{ matrix.post-build }}

      # Artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: TradeWin-${{ matrix.os }}
          path: ${{ matrix.artifact-glob }}
          retention-days: 30

      # 验证
      - name: Verify artifact
        shell: bash
        run: |
          for f in ${{ matrix.artifact-glob }}; do
            if [ -f "$f" ]; then
              SIZE=$(du -h "$f" | cut -f1)
              echo "✓ $f ($SIZE)"
            elif [ -d "$f" ]; then
              echo "✓ $f (directory)"
            else
              echo "::warning::Expected artifact not found: $f"
            fi
          done

      # 附加到 Release
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact-glob }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
