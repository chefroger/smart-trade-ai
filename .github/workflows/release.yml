name: Release Build (Mac)

# 手动触发为主（2026-11-20 决定）：Mac 包未经真机分发验证时，手动构建的
# Release 一律是 draft（W8）。tag 触发在恢复后同样产出正式 Release。
# 包内不内嵌 Hermes，运行时使用用户自己的 ~/.hermes/hermes-agent（W15 O-11）。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── macOS (pywebview → .app.zip) ──
          # 两种架构分别出包：Intel（macos-15-intel）与 Apple Silicon（macos-15）。
          # 用户的 Mac 可能是 Intel；arm64 包在 Intel 上根本无法启动。
          - os: macos-15-intel
            arch: x64
            setup-cmd: |
              pip install -e ".[desktop]"
              pip install "pyinstaller>=6.0"
            spec-path: tradewin-mac.spec
            artifact-glob: dist/TradeWin-*.zip
            post-build: |
              cd dist
              BIN="TradeWin.app/Contents/MacOS/TradeWin"
              [ -f "$BIN" ] || { echo "::error::找不到主程序 $BIN"; exit 1; }
              ARCHS=$(lipo -archs "$BIN")
              echo "built archs: $ARCHS（期望 $EXPECTED_ARCH）"
              case " $ARCHS " in
                *" $EXPECTED_ARCH "*) ;;
                *) echo "::error::产物架构不符：期望 $EXPECTED_ARCH，实际 $ARCHS"; exit 1 ;;
              esac
              zip -r "TradeWin-${VER}-macOS-x64.zip" "TradeWin.app"
              rm -rf "TradeWin.app"
          # W9：固定 Apple Silicon runner，不依赖 macos-latest 指向漂移
          - os: macos-15
            arch: arm64
            setup-cmd: |
              pip install -e ".[desktop]"
              pip install "pyinstaller>=6.0"
            spec-path: tradewin-mac.spec
            artifact-glob: dist/TradeWin-*.zip
            post-build: |
              cd dist
              BIN="TradeWin.app/Contents/MacOS/TradeWin"
              [ -f "$BIN" ] || { echo "::error::找不到主程序 $BIN"; exit 1; }
              ARCHS=$(lipo -archs "$BIN")
              echo "built archs: $ARCHS（期望 $EXPECTED_ARCH）"
              case " $ARCHS " in
                *" $EXPECTED_ARCH "*) ;;
                *) echo "::error::产物架构不符：期望 $EXPECTED_ARCH，实际 $ARCHS"; exit 1 ;;
              esac
              zip -r "TradeWin-${VER}-macOS-arm64.zip" "TradeWin.app"
              rm -rf "TradeWin.app"


    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # 与部署一致：Hermes ≥0.21.6 只提供 3.14 的依赖集，用 3.12 装会失败
          python-version: "3.14"

      - run: python -m pip install --upgrade pip

      # 安装依赖
      - name: Install dependencies
        shell: bash
        run: ${{ matrix.setup-cmd }}

      # **不打包 Hermes**（2026-11-23 实跑结论）：PyPI 的 hermes-agent 只有
      # 0.15.2，低于最低要求 0.21.6；官方最新版无法 pip 进构建环境。
      # 打包版在运行时加载用户自己的 ~/.hermes/hermes-agent
      # （trade/bootstrap.py 的 frozen 分支）。安装文档需先装 Hermes。

      # 清理旧构建
      - name: Clean old builds
        shell: bash
        run: rm -rf build dist

      # PyInstaller
      - name: Build with PyInstaller
        run: pyinstaller --clean --noconfirm ${{ matrix.spec-path }}

      # 提取版本号
      - name: Get version
        id: version
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          # tag 触发时 ref_name 是 v0.8.0 这类；手动触发时是分支名（如 main），
          # 此时改用 pyproject 的版本号，避免打出 TradeWin-main 这种名字
          if [[ "$TAG" == v* ]]; then
            VER="${TAG#v}"
            REL_TAG="$TAG"
          else
            VER="$(grep -m1 '^version' pyproject.toml | sed 's/.*"\(.*\)".*/\1/')"
            REL_TAG="v$VER"
          fi
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=$REL_TAG" >> "$GITHUB_OUTPUT"

      # 后处理（macOS 打包 .zip）
      - name: Post-build
        if: matrix.post-build != ''
        shell: bash
        env:
          VER: ${{ steps.version.outputs.ver }}
          # lipo 的架构名：matrix 的 x64 对应 x86_64
          EXPECTED_ARCH: ${{ matrix.arch == 'x64' && 'x86_64' || 'arm64' }}
        run: ${{ matrix.post-build }}

      # Artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: TradeWin-${{ matrix.os }}
          path: ${{ matrix.artifact-glob }}
          retention-days: 30

      # 验证
      - name: Verify artifact
        shell: bash
        run: |
          for f in ${{ matrix.artifact-glob }}; do
            if [ -f "$f" ]; then
              SIZE=$(du -h "$f" | cut -f1)
              echo "✓ $f ($SIZE)"
            elif [ -d "$f" ]; then
              echo "✓ $f (directory)"
            else
              echo "::warning::Expected artifact not found: $f"
            fi
          done

      # 附加到 Release（W8）：手动触发也产出 Release，但默认是 draft ——
      # 2026-11-20 口径：手动构建未经真机分发验证，不能直接公开发布。
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: ${{ matrix.artifact-glob }}
          generate_release_notes: true
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
