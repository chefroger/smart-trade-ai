name: Frontend smoke (Playwright)

# 2026-11-21 审计 P2-7：11-19 那批问题（停止按钮常驻、图标 404、到期文案）
# 全是截图时才发现的 —— 静态源码检查抓不到，必须有浏览器级冒烟。
#
# 只在「前端 / e2e 有改动」的 PR 上跑，外加每晚一次；默认 CI 不装浏览器，
# 保持 PR 反馈速度。

on:
  pull_request:
    paths:
      - "static/**"
      - "tests_e2e/**"
      # W15 O-18：app/服务入口改动会直接影响静态资源挂载与 SPA 注入
      - "trade/app.py"
      - "server.py"
      - ".github/workflows/e2e-smoke.yml"
  # 审计 O-22：直推 main（本项目的主流程）同样要跑浏览器冒烟
  push:
    branches: [main]
    paths:
      - "static/**"
      - "tests_e2e/**"
      - "trade/app.py"
      - "server.py"
      - ".github/workflows/e2e-smoke.yml"
  schedule:
    # 每天 19:00 UTC = 次日 03:00 CST
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # 冒烟不加载 Hermes（兼容检查在浏览器层被桩掉），但服务端启动所需的
      # 依赖与 test.yml 保持一致，避免「CI 能跑、这里起不来」
      - name: Install server deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio httpx
          pip install fastapi "uvicorn[standard]" pydantic pyyaml packaging python-multipart
          pip install pymupdf openpyxl python-docx python-pptx xlrd beautifulsoup4
          pip install cryptography psutil dnspython
          pip install openai==2.24.0 anthropic==0.87.0
          pip install playwright
          pip install -e . --no-deps

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run frontend smoke
        run: python -m pytest tests_e2e -v
