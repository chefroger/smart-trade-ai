name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  repo-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Repository safety gate (secrets & data files)
        run: bash scripts/repo_safety.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Python syntax check
        run: |
          python -m compileall -q trade/ server.py tests/
          echo "✓ All files compile successfully"
      # tests/ 也要 lint：2026-11-17 审计发现 PR #10 的「ruff 清零」只覆盖了
      # trade/，tests/test_contacts.py 里的 3 个 F401 因 CI 不扫 tests/ 而漏网。
      - run: ruff check trade/ server.py tests/
      - name: Frontend utils tests (node:test, 零依赖)
        run: node --test "tests_js/**/*.test.js"

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 3.14 是实际部署版本（Trade 进程内嵌 Hermes，必须与 Hermes 同 ABI）。
        # 2026-11-21 审计 P2-6：此前只测 3.11–3.13，部署用的版本从没进过 CI。
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio httpx
          pip install fastapi "uvicorn[standard]" pydantic pyyaml packaging python-multipart
          pip install pymupdf openpyxl python-docx python-pptx xlrd beautifulsoup4
          pip install cryptography psutil dnspython
          pip install openai==2.24.0 anthropic==0.87.0
          pip install -e . --no-deps

      - name: Run tests
        run: python -m pytest tests/ -v
