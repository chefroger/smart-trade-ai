name: Hermes smoke (nightly)

# 2026-11-21 审计 P2-6：普通 CI 全部用 mock，从不真正加载 Hermes ——
# 而「Hermes 升级后 import 副作用变了」正是踩过的坑。这里每晚装一份**真实的、
# 最新的** Hermes，跑 scripts/hermes_smoke.py 验证耦合点仍可导入。
#
# 为什么不在每个 PR 上跑：装 Hermes（几十个依赖）要几分钟，且依赖上游网络；
# 每晚一次足以在用户遇到之前发现上游 breaking change。

on:
  # 审计 O-22：直推 main 的提交以前完全没跑过冒烟。只在碰到 Hermes 耦合面时
  # 触发，避免每次 push 都花几分钟装 Hermes。
  push:
    branches: [main]
    paths:
      - "trade/bootstrap.py"
      - "trade/helpers.py"
      - "trade/hermes_compat.py"
      - "trade/hermes_upgrade.py"
      - "scripts/hermes_smoke.py"
      - ".github/workflows/hermes-smoke.yml"
  schedule:
    # 每天 18:00 UTC = 次日 02:00 CST，避开国内工作时间
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          # 与部署一致：Hermes ≥0.21.6 只提供 3.14 的依赖集
          python-version: "3.14"

      # 按项目策略「跟随 Hermes 最新版」：用**官方安装脚本**装 main 上最新那份。
      # 不要自己 `pip install -e .` —— 实测会撞上游依赖冲突
      # （hermes-agent 钉 Pillow==13.0.0，browser-harness 钉 pillow==12.3.0）：
      # 官方脚本走 uv + pm 锁定，才是用户真实安装路径。
      - name: Install latest Hermes (official installer)
        run: |
          curl -fsSL https://raw.githubusercontent.com/NousResearch/hermes-agent/main/scripts/install.sh \
            | bash -s -- --non-interactive --skip-browser

      - name: Install Trade (no deps)
        run: |
          python -m pip install pyyaml packaging
          pip install -e . --no-deps

      - name: Run Hermes coupling smoke
        run: python scripts/hermes_smoke.py
