# Trade 公共平台与非目标官网域名分类清单（自研维护）
#
# 说明：
#   - 域名均按「可注册后缀标签」精确匹配（如 alibaba.com 命中 abc.en.alibaba.com，
#     但绝不误判 notalibaba.com）。
#   - 用户可在 ~/.trade/platform_domains.toml 中通过 [add] / [remove] 追加或覆盖，
#     格式示例：
#       [add]
#       directory = ["my-custom-dir.example"]
#       [remove]
#       b2b_marketplace = ["some-site.com"]
#   - 读取失败或格式损坏时自动回退内置默认清单，绝不阻断背调。

